# SwiftLint Configuration for MorningGoal

# 排除的目录
excluded:
  - Pods
  - Carthage
  - vendor
  - .build
  - DerivedData
  - fastlane
  - MorningGoal.xcodeproj
  - MorningGoal/coreml

# 只扫描的目录
included:
  - MorningGoal
  - MorningGoalTests
  - MorningGoalUITests

# 禁用的规则
disabled_rules:
  - trailing_whitespace
  - todo
  - line_length

# 启用的可选规则
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - let_var_whitespace
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# 规则配置

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 160

type_body_length:
  warning: 300
  error: 700

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 7
  error: 10

force_cast:
  severity: warning

empty_count:
  severity: warning

type_name:
  min_length: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - T
    - ID

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - ID
    - x
    - y
    - dx
    - dy
    - db
    - i
    - j
    - k

nesting:
  type_level:
    warning: 2

# 自定义规则
custom_rules:
  no_objcMembers:
    name: "@objcMembers"
    regex: "@objcMembers"
    message: "Prefer @objc on individual members"
    severity: warning

# 报告器类型
reporter: "xcode"
