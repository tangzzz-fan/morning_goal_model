[pytest]
# Pytest配置文件

# 测试文件发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 输出选项
addopts = 
    # 详细输出
    -ra
    # 显示本地变量
    --showlocals
    # 短格式的traceback
    --tb=short
    # 显示测试覆盖率摘要
    --cov-report=term-missing
    # 并行运行测试（需要安装pytest-xdist）
    # -n auto
    # 显示最慢的10个测试
    --durations=10
    # 严格模式：警告视为错误
    # --strict-markers

# 标记（markers）
markers =
    unit: 单元测试，测试单个组件
    integration: 集成测试，测试多个组件交互
    quality: 质量测试，验证模型性能指标
    regression: 回归测试，对比基准模型
    slow: 运行时间较长的测试
    gpu: 需要GPU的测试

# 覆盖率配置
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# 排除不需要测试的代码
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

